<div class="middle-container">
  <div class="contact-section">
    <h1>Let's Connect</h1>
    <p class="contact-subtitle">Have a question or opportunity? I'd love to hear from you.</p>
    
    <div class="contact-content">
      <div class="contact-card">
        <h2>Get In Touch</h2>
        <form (ngSubmit)="submitForm()">
          <div class="form-group">
            <input type="text" placeholder="Your Name" required [(ngModel)]="name" name="name">
          </div>
          <div class="form-group">
            <input type="email" placeholder="Your Email" required [(ngModel)]="email" name="email">
          </div>
          <div class="form-group">
            <input type="text" placeholder="Subject" required [(ngModel)]="subject" name="subject">
          </div>
          <div class="form-group">
            <textarea placeholder="Your Message" required [(ngModel)]="message" name="message"></textarea>
          </div>
          <button class="btn" type="submit">Send Message</button>
        </form>
      </div>

      <div class="contact-info">
        <h2>Other Ways to Connect</h2>
        <div class="contact-links">
          <a href="https://linkedin.com" target="_blank" class="contact-link">
            <span class="link-icon">🔗</span>
            <div>
              <h3>LinkedIn</h3>
              <p>Connect with me professionally</p>
            </div>
          </a>
          <a href="https://github.com" target="_blank" class="contact-link">
            <span class="link-icon">💻</span>
            <div>
              <h3>GitHub</h3>
              <p>Check out my projects and code</p>
            </div>
          </a>
          <a href="mailto:bhakti@example.com" class="contact-link">
            <span class="link-icon">✉️</span>
            <div>
              <h3>Email</h3>
              <p>Send me an email directly</p>
            </div>
          </a>
          <a href="tel:+1234567890" class="contact-link">
            <span class="link-icon">📞</span>
            <div>
              <h3>Phone</h3>
              <p>Give me a call</p>
            </div>
          </a>
        </div>
      </div>
    </div>
  </div>
</div>

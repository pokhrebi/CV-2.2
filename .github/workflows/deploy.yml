name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Debug workspace
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          ls -la "$GITHUB_WORKSPACE"
          echo "Repo name: ${{ github.repository }}"
          echo "Repo base: ${{ github.repository_owner }}"

      - name: Detect repository root containing package.json
        id: detect-root
        run: |
          set -e
          CANDIDATES=("$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/${GITHUB_REPOSITORY##*/}" "$GITHUB_WORKSPACE/${{ github.repository }}")
          FOUND=""
          for p in "${CANDIDATES[@]}"; do
            if [ -f "$p/package.json" ]; then
              FOUND="$p"
              break
            fi
          done
          if [ -z "$FOUND" ]; then
            echo "No package.json found in candidates:" >&2
            for p in "${CANDIDATES[@]}"; do ls -la "$p" || true; done
            exit 1
          fi
          echo "repo_root=$FOUND" >> $GITHUB_OUTPUT
          echo "Found package.json at: $FOUND"

      - name: Install dependencies
        run: |
          cd "${{ steps.detect-root.outputs.repo_root }}"
          npm ci

      - name: Build
        run: |
          cd "${{ steps.detect-root.outputs.repo_root }}"
          npm run build -- --configuration production

      - name: Add .nojekyll file
        run: |
          cd "${{ steps.detect-root.outputs.repo_root }}"
          touch ./dist/bhakti-portfolio/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "${{ steps.detect-root.outputs.repo_root }}/dist/bhakti-portfolio"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2

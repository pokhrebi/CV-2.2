<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact Me</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="images/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Montserrat+Alternates&family=Sacramento&display=swap" rel="stylesheet">
</head>
<body>

    <div class="top-container">
        <a href="index.html"><img class="computer" src="images/favicon.png" alt="computer"></a>
        <h1 class="Name">Contact Me</h1>
        <p class="index">Let's connect, contact me below</p>
        <img class="cpu" src="images/book.png" alt="cpu">
        
        <nav class="sidenav">
            <a href="index.html">Home</a>
            <a href="Projects.html">Projects</a>
            <a href="Experiences.html">Experience</a>
            <a href="Resume.html">Resume</a>
            <a href="Contact.html" class="active">Contact</a>
        </nav>
    </div>

    <main class="middle-container">
        <div class="contact-card">
            <form id="my-form" action="https://formspree.io/f/mjvjgbop" method="POST">
                <h3 class="formLabel">Send a Message</h3>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" name="First Name" placeholder="Jane" required>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" name="Last Name" placeholder="Doe" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="Email" placeholder="jane@example.com" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone" name="Phone" placeholder="(555) 555-5555">
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="Message" rows="5" placeholder="How can I help you?" required></textarea>
                </div>

                <button type="submit" id="submit-btn">Submit</button>
                <div id="my-form-status"></div>
            </form>
        </div>
    </main>

    <footer class="bottom-container">
        <a class="linkedin" href="https://www.linkedin.com/in/bhaktipokhrel" target="_blank" rel="noreferrer noopener">LinkedIn</a>
        <a class="web-link" href="https://pokhrebi.github.io/CV1.01/" target="_blank" rel="noreferrer noopener">Website 1.0</a>
        <p class="bottom-footer">© 2021 Bhakti Pokhrel.</p>
    </footer>

    <script>
        var form = document.getElementById("my-form");
        
        async function handleSubmit(event) {
            event.preventDefault();
            var status = document.getElementById("my-form-status");
            var data = new FormData(event.target);
            
            fetch(event.target.action, {
                method: form.method,
                body: data,
                headers: { 'Accept': 'application/json' }
            }).then(response => {
                if (response.ok) {
                    status.innerHTML = "Thanks for your submission!";
                    status.className = "success";
                    form.reset();
                } else {
                    response.json().then(data => {
                        if (Object.hasOwn(data, 'errors')) {
                            status.innerHTML = data["errors"].map(error => error["message"]).join(", ");
                        } else {
                            status.innerHTML = "Oops! There was a problem submitting your form";
                        }
                        status.className = "error";
                    })
                }
            }).catch(error => {
                status.innerHTML = "Oops! There was a problem submitting your form";
                status.className = "error";
            });
        }
        form.addEventListener("submit", handleSubmit)
    </script>
</body>
</html>

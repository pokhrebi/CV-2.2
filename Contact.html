<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Contact | Bhakti Pokhrel</title>
  <meta name="description" content="Contact Bhakti Pokhrel — Software Engineer." />

  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="images/favicon.ico" />
</head>

<body>
<header class="top-container">
  <div class="header-grid">

    <img class="logo" src="./images/favicon.png" alt="Logo">

    <!-- HAMBURGER BUTTON (REQUIRED) -->
    <button class="nav-toggle" aria-label="Toggle navigation">
      ☰
    </button>

    <!-- NAVIGATION -->
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="Projects.html">Projects</a>
      <a href="Experiences.html">Experience</a>
      <a href="Resume.html">Resume</a>
      <a href="Contact.html">Contact</a>
    </nav>

    <!-- DARK MODE BUTTON -->
    <button class="theme-toggle" aria-label="Toggle dark mode">
      🌙
    </button>

  </div>
</header>


<main class="middle-container">
  <form class="contact-card" action="https://formspree.io/f/mjvjgbop" method="POST">
    <h2>Send a Message</h2>

    <div class="form-grid">
      <input type="text" name="First Name" placeholder="First Name" required />
      <input type="text" name="Last Name" placeholder="Last Name" required />
    </div>

    <input type="email" name="Email" placeholder="Email" required />
    <input type="tel" name="Phone" placeholder="Phone (optional)" />
    <textarea name="Message" placeholder="Your message..." required></textarea>

    <button type="submit">Send Message</button>
  </form>
</main>

<footer class="bottom-container">
  <p>© 2025 Bhakti Pokhrel</p>
</footer>

<script>
  document.querySelector('.nav-toggle')
    .addEventListener('click', () =>
      document.querySelector('.nav').classList.toggle('open')
    );
</script>
</body>
</html>

<html lang="en" dir="ltr">

<head>

<body>
  <div class="top-container">
    <a href="index.html"><img class="computer" src="images/favicon.png" alt="computer"></a>
    <h1 class="Name"> Contact Me</h1>
    <br>
    <p class="index">Lets connect, contact me below</p>
    <img class="cpu" src="images/book.png" alt="cpu">
    <div class="sidenav">
      <a href="index.html">Home</a>
      <a href="Projects.html">Projects</a>
      <a href="Experiences.html">Experience</a>
      <a href="Resume.html">Resume</a>
      <a href="Contact.html">Contact</a>
    </div>
  </div>
  <div class="middle-container">
    <div class="contactform">
  <form id = "my-form" action="https://formspree.io/f/mjvjgbop" method="POST" class="decor">
  <div class="form-inner">
    <h3 class="formLabel">Contact Me</h3>
    <label for="First Name: ">First Name</label>
    <input type="text" name="First Name: " placeholder="First Name">
    <br>
    <label for="Last Name: ">Last Name</label>
    <input type="text" name="Last Name: " placeholder="Last Name">
    <br>
    <label for="Email: ">Email</label>
    <input type="email" name="Email: " placeholder="Email">
    <br>
    <label for="Phone: ">Phone</label>
    <input type="tel" name="Phone: " placeholder="Phone">
    <br>
    <label for="Message: ">Message</label>
    <textarea placeholder="Message..." name="Message: " rows="5"></textarea>
    <button type="submit" value = "send" >Submit</button>
  </div>
</form>
  </div>
  </div>
  <div class="bottom-container">
    <a class="linkedin" href="https://www.linkedin.com/in/bhaktipokhrel" target="_blank" rel="noreferrer noopener">LinkedIn</a>
    <a class="web-link" href="https://pokhrebi.github.io/CV1.01/" target="_blank" rel="noreferrer noopener"> Website 1.0 </a>
    <p class="bottom-footer">© 2021 Bhakti Pokhrel.</p>
  </div>
</body>
  <script>
    var form = document.getElementById("my-form");
    
    async function handleSubmit(event) {
      event.preventDefault();
      var status = document.getElementById("my-form-status");
      var data = new FormData(event.target);
      fetch(event.target.action, {
        method: form.method,
        body: data,
        headers: {
            'Accept': 'application/json'
        }
      }).then(response => {
        status.innerHTML = "Thanks for your submission! I will get in touch with you";
        form.reset()
      }).catch(error => {
        status.innerHTML = "Oops! There was a problem submitting your form"
      });
    }
    form.addEventListener("submit", handleSubmit)
</script>

</html>
